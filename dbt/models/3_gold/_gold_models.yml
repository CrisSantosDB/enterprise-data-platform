version: 2

models:
  - name: dim_clientes
    description: "Dimensão da tabela clientes"
    columns:
      - name: sk_clientes
        description: "Chave substituta (surrogate key) da dimensão cliente."
        data_tests: [unique, not_null]

      - name: id_clientes
        description: "Identificador de negócio original (natural key) do cliente."
        data_tests: [unique, not_null]

      - name: cliente
        description: "Nome completo da pessoa física ou razão social do cliente."
        data_tests: [not_null]

      - name: endereco
        description: "Endereço cadastral informado do cliente."
        data_tests: [not_null]

  - name: dim_veiculos
    description: "Dimensão da tabela veiculos"
    columns:
      - name: sk_veiculos
        description: "Chave substituta (surrogate key) da dimensão veículo."
        data_tests: [unique, not_null]

      - name: id_veiculos
        description: "Identificador de negócio original (natural key) do veículo."
        data_tests: [not_null]

      - name: nome
        description: "Nome do modelo comercial do veículo."
        data_tests: [not_null]

      - name: tipo
        description: "Tipo de carroceria ou classificação de uso do veículo (ex: SUV, Sedan, Hatch)."
        data_tests: [not_null]

      - name: categoria_veiculo
        description: "Categoria operacional ou porte do veículo."
        data_tests: [not_null]

      - name: segmento_veiculo
        description: "Segmento de mercado e posicionamento comercial do veículo."
        data_tests:
          - accepted_values:
              arguments:
                values: ["Standard", "Premium", "Luxo", "Nao Informado"]

  - name: dim_vendedores
    description: "Dimensão da tabela silver_vendedores"
    columns:
      - name: sk_vendedores
        description: "Chave substituta (surrogate key) da dimensão vendedor."
        data_tests: [unique, not_null]

      - name: id_vendedores
        description: "Identificador de negócio original (natural key) do vendedor."
        data_tests: [not_null]

      - name: nome
        description: "Nome completo do vendedor responsável."
        data_tests: [not_null]

  - name: dim_concessionarias
    description: "Dimensão de concessionárias consolidada"
    columns:
      - name: sk_concessionarias
        description: "Chave substituta (surrogate key) da dimensão concessionária."
        data_tests: [unique, not_null]

      - name: id_concessionarias
        description: "Identificador de negócio original (natural key) da concessionária."
        data_tests: [not_null]

      - name: concessionaria
        description: "Nome fantasia ou razão social da concessionária."
        data_tests: [not_null]

      - name: cidade
        description: "Nome do município onde a concessionária está localizada."
        data_tests: [not_null]

      - name: estado
        description: "Nome por extenso do estado de localização da concessionária."
        data_tests: [not_null]

      - name: sigla
        description: "Sigla da unidade federativa (UF) da concessionária."
        data_tests: [not_null]

      - name: regiao
        description: "Região geográfica brasileira da concessionária (ex: Nordeste, Sudeste)."
        data_tests: [not_null]

  - name: dim_data
    description: "Dimensão de calendário para análises temporais e suporte a regras bancárias/comerciais."
    columns:
      - name: sk_data
        description: "Surrogate key numérica no padrão YYYYMMDD."
        data_tests:
          - unique
          - not_null

      - name: dt_data
        description: "Data nativa no formato DATE."
        data_tests:
          - unique
          - not_null

      - name: ano
        description: "Ano civil com 4 dígitos (ex: 2026)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1900
                max_value: 2031

      - name: semestre
        description: "Semestre do ano (1 para primeiro semestre, 2 para segundo semestre)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 2

      - name: trimestre
        description: "Trimestre do ano (1 a 4)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 4

      - name: mes
        description: "Número do mês no ano (1 a 12)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 12

      - name: dia_mes
        description: "Dia do mês corrente (1 a 31)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 31

      - name: dia_semana_numero
        description: "Número correspondente ao dia da semana (1 para Domingo até 7 para Sábado)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 7

      - name: nome_mes_pt
        description: "Nome por extenso do mês em língua portuguesa."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Janeiro"
                  - "Fevereiro"
                  - "Março"
                  - "Abril"
                  - "Maio"
                  - "Junho"
                  - "Julho"
                  - "Agosto"
                  - "Setembro"
                  - "Outubro"
                  - "Novembro"
                  - "Dezembro"
                  - "Nao Informado"

      - name: nome_dia_semana_pt
        description: "Nome por extenso do dia da semana em língua portuguesa."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Domingo"
                  - "Segunda-feira"
                  - "Terça-feira"
                  - "Quarta-feira"
                  - "Quinta-feira"
                  - "Sexta-feira"
                  - "Sábado"
                  - "Nao Informado"

      - name: eh_fim_de_semana
        description: "Indicador booleano (TRUE/FALSE) que identifica se a data cai em sábado ou domingo."
        data_tests:
          - not_null

      - name: eh_dia_util
        description: "Indicador booleano (TRUE/FALSE) que identifica se o dia é produtivo/útil comum."
        data_tests:
          - not_null

      - name: eh_dia_util_bancario
        description: "Indicador booleano (TRUE/FALSE) que sinaliza funcionamento de compensação bancária (exclui finais de semana e feriados nacionais)."
        data_tests:
          - not_null
      
  - name: fato_vendas
    description: >
      Tabela fato transacional de vendas de veículos da camada Gold, modelada no grão de uma linha por transação de venda (`id_vendas`).
      Contém métricas financeiras aditivas (valor pago, valor de tabela e percentual de desconto) e relaciona-se via chaves substitutas (`sk_*`) 
      com as dimensões de clientes, vendedores, concessionárias, veículos e calendário (`dim_data`) para suporte a análises gerenciais e de faturamento.
    columns:
      - name: id_vendas
        description: "Chave primária natural da transação de venda na origem."
        data_tests: [unique, not_null]
      
      - name: sk_vendedores
        description: "Chave substituta que referencia a dim_vendedores. Recebe '-1' caso o vendedor seja nulo ou órfão."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendedores')
                field: sk_vendedores
     
      - name: sk_concessionarias
        description: "Chave substituta que referencia a dim_concessionarias. Recebe '-1' caso seja nula ou órfã."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_concessionarias')
                field: sk_concessionarias

      - name: sk_clientes
        description: "Chave substituta que referencia a dim_clientes. Recebe '-1' caso o cliente seja nulo ou órfão."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: sk_clientes
      
      - name: sk_veiculos
        description: "Chave substituta que referencia a dim_veiculos. Recebe '-1' caso o veículo seja nulo ou órfão."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_veiculos')
                field: sk_veiculos

      - name: sk_data
        description: "Chave substituta numérica no formato YYYYMMDD que referencia a dim_data. Recebe -1 quando ausente."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: sk_data
      
      - name: data_venda
        description: "Data civil da conclusão da transação de venda."

      - name: quantidade_vendas
        description: "Métrica unitária de contagem de transações (sempre 1 por registo)."
        data_tests:
          - not_null

      - name: valor_tabela
        description: "Preço de tabela de referência do veículo na época da transação."
        data_tests:
          - not_null

      - name: valor_pago
        description: "Valor financeiro líquido efetivamente pago pelo cliente na venda."
        data_tests:
          - not_null
          - positive_value
      
      - name: valor_desconto
        description: "Valor monetário do desconto concedido (valor_tabela subtraído de valor_pago)."
        data_tests:
          - not_null

      - name: flag_desconto
        description: "Indicador binário de aplicação de desconto (1 quando valor_desconto > 0, caso contrário 0)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: percentual_desconto
        description: "Percentual de desconto calculado em relação ao valor de tabela, arredondado a 3 casas decimais."
        data_tests:
          - accepted_range:
              arguments:
                min_value: "{{ var('percentual_desconto_min') }}"
                max_value: "{{ var('percentual_desconto_max') }}"

      - name: data_inclusao
        description: "Timestamp de auditoria da inserção do registo na camada de origem."

  

  - name: mart_vendas_por_vendedores
    description: "Painel consolidado de ranking de performance de vendas mensal por vendedor."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano_mes
            - id_vendedores
            - concessionaria

    columns:
      - name: ano_mes
        description: "Ano e mês da apuração (formato YYYY-MM)."
        data_tests:
          - not_null

      - name: id_vendedores
        description: "Chave natural do vendedor."
        data_tests:
          - not_null

      - name: vendedor
        description: "Nome do vendedor."
        data_tests:
          - not_null

      - name: concessionaria
        description: "Nome da concessionária onde as vendas foram realizadas."
        data_tests:
          - not_null

      - name: cidade
        description: "Cidade da concessionária."
        data_tests:
          - not_null

      - name: estado
        description: "UF da concessionária."
        data_tests:
          - not_null

      - name: regiao
        description: "Região geográfica da concessionária."
        data_tests:
          - not_null

      - name: quantidade_vendas
        description: "Volume total de vendas concretizadas no período."
        data_tests:
          - not_null

      - name: receita
        description: "Faturamento bruto total no período."
        data_tests:
          - not_null

      - name: ticket_medio
        description: "Valor médio faturado por venda (receita / quantidade_vendas)."
        data_tests:
          - not_null

      - name: posicao_vendedores
        description: "Posição ordinal no ranking mensal de faturamento (DENSE_RANK)."
        data_tests:
          - not_null

  - name: mart_comparacao_concessionarias
    description: "Comparação de desempenho e ranking de concessionárias em nível global e regional."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano_mes
            - id_concessionarias

    columns:
      - name: ano_mes
        description: "Ano e mês de apuração (formato YYYY-MM)."
        data_tests:
          - not_null

      - name: id_concessionarias
        description: "Chave natural da concessionária."
        data_tests:
          - not_null

      - name: concessionaria
        description: "Nome da unidade ou filial."
        data_tests:
          - not_null

      - name: cidade
        description: "Cidade da concessionária."
        data_tests:
          - not_null

      - name: estado
        description: "UF da concessionária."
        data_tests:
          - not_null

      - name: regiao
        description: "Região geográfica da concessionária."
        data_tests:
          - not_null

      - name: quantidade_vendas
        description: "Volume total de veículos vendidos na competência."
        data_tests:
          - not_null

      - name: receita
        description: "Faturamento bruto total apurado no período."
        data_tests:
          - not_null

      - name: ticket_medio
        description: "Valor médio faturado por venda (receita / quantidade_vendas)."
        data_tests:
          - not_null

      - name: posicao_nacional
        description: "Posição ordinal no ranking geral da rede (DENSE_RANK)."
        data_tests:
          - not_null

      - name: posicao_regional
        description: "Posição ordinal no ranking restrito à região geográfica."
        data_tests:
          - not_null

  - name: mart_visao_geral_mes
    description: "Visão consolidada mensal da operação comercial com receita líquida, receita bruta e evolução MoM."
    columns:
      - name: ano_mes
        description: "Ano e mês de competência (grão da tabela no formato YYYY-MM)."
        data_tests:
          - unique
          - not_null

      - name: quantidade_vendas_mes
        description: "Volume total de veículos faturados no mês."
        data_tests:
          - not_null

      - name: receita_liquida
        description: "Faturamento líquido total faturado no mês."
        data_tests:
          - not_null
          - positive_value

      - name: desconto_total
        description: "Montante financeiro concedido em descontos no período."
        data_tests:
          - not_null

      - name: receita_bruta
        description: "Faturamento bruto total (receita líquida + descontos)."
        data_tests:
          - not_null
          - positive_value

      - name: ticket_medio
        description: "Valor médio faturado por veículo vendido no mês."
        data_tests:
          - not_null
          - positive_value

  - name: audit_vendas_sem_clientes
    description: "Auditoria de integridade referencial: transações de vendas cujo id_clientes não foi encontrado no cadastro silver_clientes."
    data_tests:
      - must_be_empty:
          config:
            severity: warn

  - name: audit_vendas_sem_concessionarias
    description: "Auditoria de integridade referencial: transações de vendas cujo id_concessionarias não foi encontrado em silver_concessionarias."
    data_tests:
      - must_be_empty:
          config:
            severity: warn

  - name: audit_vendas_sem_veiculos
    description: "Auditoria de integridade referencial: transações de vendas cujo id_veiculos não foi encontrado no catálogo silver_veiculos."
    data_tests:
      - must_be_empty:
          config:
            severity: warn

  - name: audit_vendas_sem_vendedor
    description: "Auditoria de integridade referencial: transações de vendas cujo id_vendedores não foi encontrado em silver_vendedores."
    data_tests:
      - must_be_empty:
          config:
            severity: warn